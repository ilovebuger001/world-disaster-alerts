[package]
name = "world-disaster-alerts"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "World Disaster Alerts — Rust backend, release Rev.3 (implements the Rev.2.9 engineering specification)"
license = "MIT"
publish = false

[lib]
name = "wda"
path = "src/lib.rs"

[[bin]]
name = "wda-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-stream = "0.1"
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["fs", "trace", "set-header"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
quick-xml = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redb = "2"
rstar = "0.12"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
