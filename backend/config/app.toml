# World Disaster Alerts — application configuration.
# development: sources still pending legal review may run, but are never
# marked for public redistribution. production refuses to start in that case.
environment = "development"
bind = "0.0.0.0:8080"
data_dir = "data"
sources_file = "config/sources.example.toml"
severity_mapping_file = "config/severity-mapping.toml"
frontend_dir = "frontend"
user_agent = "WorldDisasterAlerts/0.1 (+https://github.com/ilovebuger001/world-disaster-alerts)"
max_in_flight_fetches = 4
event_log_retention = 100000
max_replay_events = 1000
sse_max_connections = 1000
sse_max_per_ip = 8
sse_client_queue = 64
sse_heartbeat_seconds = 20
writer_queue = 256
allow_private_destinations = false

[http]
# Exact origins allowed to call the API from another site (e.g. GitHub Pages).
# Empty = same-origin only. Override with WDA_CORS_ORIGINS="https://a,https://b".
cors_allowed_origins = []
rate_limit_per_minute = 300
trust_forwarded_for = false
hsts = false

[geocoder]
# Address search via Nominatim, server-side only. Off by default; turning it on
# means accepting the OSMF usage policy (≤1 req/s, attribution, no bulk use).
enabled = false
base_url = "https://nominatim.openstreetmap.org"
min_interval_ms = 1100
cache_entries = 2000

[reference]
contacts_file = "reference/emergency_contacts.json"
guides_file = "reference/guides.json"
facilities_file = "reference/facilities.json"
