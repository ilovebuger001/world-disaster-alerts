<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>World Disaster Alerts — ตัวอย่าง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
(function(){try{var t=localStorage.getItem('wda.theme')||'auto';var d=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';}catch(e){document.documentElement.dataset.theme='light';}})();
</script>
<style>
:root{
  --font:"Inter","Noto Sans Thai",system-ui,sans-serif;
  --panel:#ffffff;--panel2:#f3f5f8;--text:#1f2329;--muted:#5f6873;--line:#e2e5ea;--accent:#1f2937;--focus:#1a73e8;
  --shadow:0 2px 6px rgba(15,23,42,.15),0 8px 24px rgba(15,23,42,.10);
  --emergency:#c5221f;--warning:#e8710a;--watch:#e3a008;--advisory:#1967d2;--information:#5f6b7a;--unknown:#9aa3ae;
  --c-shelter:#2563eb;--c-safe:#0f766e;--c-hospital:#7c3aed;--c-community:#0891b2;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
[data-theme=dark]{--panel:#1e2228;--panel2:#272c34;--text:#e8eaed;--muted:#a1a8b3;--line:#343a44;--accent:#e8eaed;--focus:#8ab4f8;--shadow:0 2px 6px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{position:fixed;inset:0}
#mapwrap{position:absolute;inset:0;background:#b9dcf5;transition:background .2s}
#map{position:absolute;inset:0}
.maploading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#475569;font-size:14px}

/* top bar */
.top{position:absolute;top:calc(12px + var(--safe-t));left:12px;right:12px;display:flex;gap:10px;align-items:flex-start;z-index:30;pointer-events:none}
.top>*{pointer-events:auto}
.search{position:relative;width:400px;flex:none}
.search .pill{display:flex;align-items:center;height:48px;background:var(--panel);border-radius:24px;box-shadow:var(--shadow);padding:0 6px 0 16px;gap:10px}
.search input{flex:1;border:0;background:none;outline:none;height:100%;font-size:15.5px;min-width:0}
.search input::-webkit-search-cancel-button{display:none}
.search .pill svg{color:var(--muted);flex:none}
.iconbtn{width:38px;height:38px;border-radius:50%;border:0;background:none;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.iconbtn:hover{background:var(--panel2)}
.sugg{position:absolute;top:54px;left:0;right:0;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;display:none;padding:6px 0}
.sugg.open{display:block}
.sugg h4{margin:8px 16px 2px;font-size:11.5px;letter-spacing:.05em;color:var(--muted);font-weight:600}
.sugg [role=option]{display:flex;gap:12px;align-items:center;padding:8px 16px;cursor:pointer}
.sugg [role=option][aria-selected=true],.sugg [role=option]:hover{background:var(--panel2)}
.sugg .sub{color:var(--muted);font-size:12.5px}
.sugg .none{padding:10px 16px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 2px 8px;min-width:0;flex:1}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px 0 11px;border-radius:18px;border:0;background:var(--panel);box-shadow:var(--shadow);font-size:13.5px;font-weight:500;white-space:nowrap;flex:none}
.chip .cdot{width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff}
.chip[aria-pressed=false]{opacity:.62}
.chip[aria-pressed=false] .cdot{background:#9aa3ae!important}
.chip .n{color:var(--muted);font-weight:500}

/* right controls */
.ctrls{position:absolute;right:14px;bottom:calc(18px + var(--safe-b));display:flex;flex-direction:column;gap:10px;z-index:20;align-items:flex-end}
.cbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--panel);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;color:var(--text);font-size:20px}
.cbtn[aria-pressed=true]{color:var(--focus)}
.zoom{display:flex;flex-direction:column;border-radius:22px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden}
.zoom button{width:44px;height:44px;border:0;background:none;font-size:22px;color:var(--text)}
.zoom button+button{border-top:1px solid var(--line)}
.row{display:flex;gap:10px}
.langpill{height:44px;border-radius:22px;border:0;background:var(--panel);box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;padding:0 16px;font-weight:600;font-size:14px}

/* status + legend */
.statusbar{position:absolute;left:14px;bottom:calc(18px + var(--safe-b));z-index:20;display:flex;flex-direction:column;gap:8px;align-items:flex-start;max-width:calc(100% - 200px)}
.status{display:flex;align-items:center;gap:7px;background:var(--panel);box-shadow:var(--shadow);border-radius:16px;padding:6px 12px;font-size:12.5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--watch)}
.legend{background:var(--panel);box-shadow:var(--shadow);border-radius:14px;padding:8px 12px;font-size:12px;display:flex;flex-wrap:wrap;gap:4px 12px}
.legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block}
.sq{border-radius:3px}
.nomark{position:absolute;left:50%;bottom:calc(18px + var(--safe-b));transform:translateX(-50%);background:var(--panel);border-radius:16px;padding:8px 14px;font-size:13px;box-shadow:var(--shadow);z-index:19;max-width:60%;text-align:center}
.nomark[hidden]{display:none}

/* side card (desktop) / bottom sheet (mobile) */
.detail{position:absolute;left:12px;top:calc(72px + var(--safe-t));bottom:12px;width:400px;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);z-index:25;display:none;flex-direction:column;overflow:hidden}
.app.has-detail .detail{display:flex}
.detail-inner{overflow:auto;padding:16px 18px 24px;flex:1}
.sheetbar{display:none}
.app.has-detail .chips{visibility:visible}

/* floating panels */
.float{position:absolute;right:72px;top:calc(72px + var(--safe-t));width:370px;max-height:calc(100% - 165px);overflow:auto;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;z-index:26;display:none}
.float.open{display:block}
.float h2{font-size:16px;margin:0 0 6px;display:flex;justify-content:space-between;align-items:center}
.float h3{font-size:13px;margin:14px 0 6px;color:var(--muted);font-weight:600}
.float p,.float li{font-size:13.5px;margin:4px 0}
.x{border:0;background:none;width:36px;height:36px;border-radius:50%;font-size:22px;line-height:1;color:var(--muted);flex:none}
.x:hover{background:var(--panel2)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--panel2);padding:8px 6px;font-size:13px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--panel)}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:4px 12px;font-size:13px;min-height:32px}
.fchip[aria-pressed=true]{background:var(--accent);color:var(--panel);border-color:var(--accent)}
.clear{border:0;background:none;color:var(--focus);font-size:13px;padding:6px 0;margin-top:8px}
.srcrow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.health{font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;height:fit-content}
.health.ok{color:#1967d2;border-color:#1967d255}.health.delayed{color:#b07800;border-color:#b0780055}.health.stale{color:var(--emergency);border-color:#c5221f55}
.item{display:flex;gap:10px;padding:10px 4px;border:0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none}
.item:hover{background:var(--panel2)}
.item .t{font-weight:600;font-size:14px}
.item .m{font-size:12.5px;color:var(--muted)}
.ico{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.ico.f{border-radius:8px}
.tabs{display:flex;gap:6px;margin:6px 0 4px}
/* detail content */
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.dhead h1{font-size:20px;margin:8px 0 2px;line-height:1.3}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;color:#fff;white-space:nowrap}
.pill2{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;margin-left:4px}
.demo{background:var(--panel2);border-radius:10px;padding:8px 10px;font-size:12.5px;color:var(--muted);margin:10px 0}
.note{font-size:13.5px;margin:8px 0;padding:8px 10px;border-radius:10px;border:1px solid var(--line)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:13.5px;margin:10px 0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.sec{margin-top:16px}
.sec h2{font-size:12.5px;color:var(--muted);font-weight:600;margin:0 0 6px;letter-spacing:.04em}
.quote{border-left:3px solid var(--line);padding:6px 12px;background:var(--panel2);border-radius:0 8px 8px 0;font-size:14px;white-space:pre-wrap}
.mt{font-size:12px;color:var(--muted);margin-bottom:4px}
.srcbtn{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:10px 16px;border-radius:20px;background:var(--focus);color:#fff;text-decoration:none;font-weight:600;font-size:14px}
[data-theme=dark] .srcbtn{color:#111}
.st-open{color:#1967d2}.st-full,.st-closed{color:var(--emergency)}.st-unknown,.st-not_yet_open,.st-temporarily_unavailable{color:#b07800}
.toast{position:absolute;left:50%;top:calc(130px + var(--safe-t));transform:translateX(-50%);background:#202124;color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

@media (max-width:760px){
  .top{flex-direction:column;gap:8px;left:10px;right:10px}
  .search{width:100%}
  .chips{width:100%;padding-bottom:6px}
  .statusbar{left:10px;max-width:calc(100% - 170px)}.status span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{max-width:100%}
  .legend{display:none}
  .ctrls{right:10px}
  .detail{left:0;right:0;top:auto;bottom:0;width:auto;height:52%;border-radius:18px 18px 0 0;transition:height .2s ease}
  .app.sheet-full .detail{height:calc(100% - 8px - var(--safe-t))}
  .app.has-detail .ctrls,.app.has-detail .statusbar{display:none}
  .detail-inner{padding:2px 16px calc(24px + var(--safe-b))}
  .sheetbar{display:flex;justify-content:center;padding:8px 0 2px}
  .sheetbar button{width:64px;height:22px;border:0;background:none;display:flex;align-items:center;justify-content:center}
  .sheetbar span{width:40px;height:5px;border-radius:3px;background:var(--line)}
  .float{left:10px;right:10px;width:auto;top:auto;bottom:calc(10px + var(--safe-b));max-height:72%}
  .nomark{max-width:80%;bottom:auto;top:calc(120px + var(--safe-t))}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div id="mapwrap">
    <div class="maploading" id="maploading"></div>
    <div id="map" role="application" aria-label="แผนที่"></div>
  </div>

  <div class="top">
    <div class="search" role="combobox" aria-haspopup="listbox" aria-owns="sugg" aria-expanded="false" id="searchbox">
      <div class="pill">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="q" type="search" autocomplete="off" aria-autocomplete="list" aria-controls="sugg">
        <button class="iconbtn" id="qclear" hidden aria-label="ล้าง">×</button>
        <button class="iconbtn" id="filterBtn" aria-controls="filters" aria-label="ตัวกรอง"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      </div>
      <div class="sugg" id="sugg" role="listbox"></div>
    </div>
    <div class="chips" id="chips" role="toolbar"></div>
  </div>

  <aside class="detail" id="detail">
    <div class="sheetbar"><button id="sheetToggle" aria-label="ขยาย"><span></span></button></div>
    <div class="detail-inner" id="detailInner"></div>
  </aside>

  <div class="nomark" id="nomark" hidden></div>
  <div class="statusbar">
    <div class="legend" id="legend" aria-hidden="true"></div>
    <div class="status" role="status" aria-live="polite"><span class="dot"></span><span id="statusText"></span></div>
  </div>

  <div class="ctrls">
    <button class="cbtn" id="listBtn" aria-pressed="false" aria-controls="listPanel"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h1M3 12h1M3 18h1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <button class="cbtn" id="styleBtn" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
    <button class="cbtn" id="worldBtn"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l4 10h-8z" fill="#d93025"/><path d="M12 22l-4-10h8z" fill="#9aa0a6"/></svg></button>
    <button class="cbtn" id="locBtn"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <div class="zoom"><button id="zin" aria-label="+">+</button><button id="zout" aria-label="−">−</button></div>
    <div class="row">
      <button class="langpill" id="langBtn" aria-controls="settings"><span id="langCode">TH</span><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
      <button class="cbtn" id="helpBtn" aria-pressed="false" aria-controls="help">?</button>
    </div>
  </div>

  <div class="float" id="listPanel" role="region"></div>
  <div class="float" id="filters" role="dialog"></div>
  <div class="float" id="help" role="dialog"></div>
  <div class="float" id="settings" role="dialog"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
