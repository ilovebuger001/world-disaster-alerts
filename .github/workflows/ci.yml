name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Build
        run: cargo build --locked --all-targets
      - name: Test
        run: cargo test --locked --all-targets -- --test-threads=4
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Format
        run: cargo fmt --check
      - name: Live smoke test (real USGS feed)
        continue-on-error: true
        run: |
          cargo build --locked --release
          mkdir -p /tmp/wda && WDA_BIND=127.0.0.1:8080 ./target/release/wda-server > /tmp/wda/server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/health/ready && break; sleep 2; done
          sleep 75
          echo "--- meta";    curl -fsS http://127.0.0.1:8080/api/v1/meta; echo
          echo "--- sources"; curl -fsS http://127.0.0.1:8080/api/v1/sources | head -c 1500; echo
          echo "--- alerts";  curl -fsS "http://127.0.0.1:8080/api/v1/alerts?west=-180&south=-85&east=180&north=85&zoom=2" | python3 -c "import sys,json;d=json.load(sys.stdin);print('total',d['total_matching'],'features',len(d['features']),'seq',d['event_sequence']);print(json.dumps(d['items'][:1],ensure_ascii=False)[:800])"
          echo "--- stream";  timeout 5 curl -sN "http://127.0.0.1:8080/api/v1/stream?after=0" | head -c 600 || true; echo
          echo "--- frontend"; curl -fsS -o /dev/null -w "%{http_code}\n" http://127.0.0.1:8080/
          echo "--- log"; tail -20 /tmp/wda/server.log
